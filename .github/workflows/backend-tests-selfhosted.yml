# Backend test suite sharded across self-hosted runners.
#
# Security posture (public repo + self-hosted runners):
# - Triggers are push-to-dev and manual dispatch ONLY — never pull_request,
#   so code from forks can never execute on these runners.
# - Repo Actions policy additionally requires approval for all external
#   contributors' workflow runs (fork-pr-contributor-approval).
# - checkout uses persist-credentials: false; jobs need no repo secrets.
#
# Shard count is 2, matching the number of physical self-hosted runners
# registered under the "ba-tests" label (one arm64, one x64 — see the
# per-arch branch below). More shards than
# runners buys nothing: GitHub can only run as many matrix jobs concurrently
# as there are idle runners, so a 3rd/4th shard just queues behind the first
# two on whichever machine frees up first, paying a full extra checkout +
# image-materialization + artifact-upload overhead for no added
# parallelism. Within each of the 2 shards, pytest-xdist (see
# BETTER_AGENT_TEST_XDIST below) saturates that job's own allocated CPUs —
# that's where the real concurrency now comes from, not shard count.
name: backend-tests-selfhosted

on:
  push:
    branches: [dev]
  workflow_dispatch:

# One run executes at a time; the pending slot always holds only the NEWEST
# queued push (GitHub replaces a pending run in the same group). No
# cancel-in-progress: dev receives frequent pushes and cancelling mid-run
# meant full suites never finished.
concurrency:
  group: backend-tests-selfhosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-shard:
    if: github.repository == 'ofekron/better-agent'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: [self-hosted, ba-tests]
    timeout-minutes: 120
    # Per-test timeout (scripts/run-backend-tests.sh forwards this to
    # pytest-timeout as --timeout/--timeout-method=signal; see that script's
    # header for the rationale). CI-only default — local dev runs stay
    # timeout-free unless a caller sets BETTER_AGENT_TEST_TIMEOUT themselves.
    # 120s bounds any single test well below the 120-minute job timeout, so a
    # hang now fails one test with a thread-stack dump instead of silently
    # consuming the whole job budget with no diagnostic (the failure mode
    # that hid the 2026-08-07 shard-0 hang's stack trace and test name).
    env:
      BETTER_AGENT_TEST_TIMEOUT: "120"
    steps:
      # Belt-and-suspenders for docker/entrypoint-test.sh's own chown-back
      # (scripts/lib/docker-test-lifecycle.sh's docker_test_chown_env_args):
      # that only fires on a container that exits normally. A killed/137'd
      # test container (OOM, timeout-killer, manual cancel) never reaches
      # its entrypoint's post-pytest chown, so root-owned droppings from a
      # PAST run can still be sitting in the workspace when THIS job's
      # checkout runs. Self-heal them here, before checkout touches
      # anything, using docker itself as the privilege boundary (root
      # inside a throwaway container, not the unprivileged `runner` user
      # gaining privileges) — no sudoers changes needed. Linux-only:
      # macOS/Docker Desktop already remaps bind-mount ownership, so a
      # macOS runner in this same matrix never accumulates root-owned
      # files in the first place.
      - name: Restore workspace ownership before checkout (self-hosted Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$GITHUB_WORKSPACE" ]; then
            echo "workspace not present yet; nothing to restore"
            exit 0
          fi
          # Any previously-materialized backend test image works — it's
          # only used as a throwaway root shell for `chown`, never run as
          # the app. Skip cleanly if none is cached yet (e.g. this runner's
          # very first job): a workspace with no prior job in it has
          # nothing to be poisoned.
          image="$(docker images --filter 'reference=better-agent-backend-tests:deps-*' --format '{{.Repository}}:{{.Tag}}' | head -n1)"
          if [ -z "$image" ]; then
            echo "no cached backend test image yet; nothing to restore"
            exit 0
          fi
          # --entrypoint: the image's default entrypoint is the pytest
          # wrapper (docker/entrypoint-test.sh), which would swallow these
          # args as pytest args — override it to run chown directly.
          docker run --rm --entrypoint chown -v "$GITHUB_WORKSPACE:/w" "$image" \
            -R "$(id -u):$(id -g)" /w
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Per-runner container resource caps (consumed by
      # scripts/run-backend-tests.sh via docker_test_resource_cap_args in
      # scripts/lib/docker-test-lifecycle.sh). Keyed off runner.arch, not
      # runner.name, so this is independent of the shard matrix and doesn't
      # need updating if a runner is renamed:
      #   - arm64 == a shared workstation that is also used interactively,
      #     so CI must never be able to starve foreground work. Budget:
      #     3 CPUs / 6g, AND a halved cgroup CPU-share weight (512 vs
      #     docker's default 1024). The weight only costs the container
      #     CPU when something else is actually contending, so an idle
      #     host still lets the container burst to its ceiling (fast),
      #     while active foreground use pushes its share down (invisible).
      #   - anything else == a dedicated test host (x64, docker-ce on
      #     Linux), not used interactively, so there is no foreground work
      #     to protect. Budget: 5 CPUs / 5g, sized to leave the host
      #     enough headroom never to OOM the runner process itself.
      #     Default CPU share — nothing competes with it.
      # BETTER_AGENT_TEST_XDIST sets the pytest-xdist worker count
      # (docker_test_xdist_pytest_args in scripts/lib/docker-test-lifecycle.sh
      # turns this into `-n <value> --dist loadfile`) equal to this job's
      # BETTER_AGENT_TEST_CPUS — one worker per whole CPU the container is
      # capped to, so workers never contend with each other for a core.
      # `--dist loadfile` is what makes this safe: every test in
      # a file stays on one worker PROCESS, so the module-level state leaks
      # this suite has hit before (worker_store attribute leak, unscoped
      # monkeypatches — see git history on backend/scripts/conftest.py and
      # _test_home.py) can only ever affect later files in the SAME worker,
      # never a file running in a different worker process — strictly
      # stronger isolation than today's single sequential process, where
      # every file already shares one process's module table for the whole
      # shard.
      - name: Set per-runner backend test container caps
        shell: bash
        run: |
          set -euo pipefail
          # xdist is DISABLED in CI (=1) despite being the local default.
          # Measured 2026-08-08: a shard of ~450 files hung at xdist's
          # "bringing up nodes..." for over two hours and never started a
          # test. Cause is collection cost, not a deadlock — EVERY xdist
          # worker independently imports and collects the whole shard.
          # Root cause found the same day (see backend/operation_catalog.py):
          # `import main` alone cost ~65s single-process, ~50s of it inside
          # capability_api.py — every one of its ~150 capability
          # registrations eagerly walked+hashed the whole repo tree
          # (operation_catalog.register_capability's per-action artifact
          # digest check), even though nearly all of them share one artifact
          # root, so the same multi-thousand-file walk ran ~150 times in a
          # row. N xdist workers each independently paying that cost, inside
          # an N-CPU cap, is strictly slower than one process. Fixed by
          # deferring the digest to `publish()`, which resolves it once per
          # unique root instead of once per action — `import main` dropped
          # to ~20s single-process in the same environment. (The earlier
          # theory that heavy transitive ML imports — onnxruntime, model2vec,
          # tokenizers — drove the ~16-minute single-process collection
          # number did not hold up on inspection: project_match/embedding.py
          # already imports those lazily, only inside the function that
          # needs them, so they were never the actual cause.)
          # xdist stays on locally because collection there is cheap:
          # targeted runs are a handful of files, and a 10-file local run
          # measured faster with 3 workers than without.
          # Re-enable here only after re-measuring per-shard collection cost
          # with this fix; until then more shards (less collection per job)
          # is the lever.
          if [ "${{ runner.arch }}" = "ARM64" ]; then
            echo "BETTER_AGENT_TEST_CPUS=3" >> "$GITHUB_ENV"
            echo "BETTER_AGENT_TEST_MEMORY=6g" >> "$GITHUB_ENV"
            echo "BETTER_AGENT_TEST_CPU_SHARES=512" >> "$GITHUB_ENV"
            echo "BETTER_AGENT_TEST_XDIST=1" >> "$GITHUB_ENV"
          else
            echo "BETTER_AGENT_TEST_CPUS=5" >> "$GITHUB_ENV"
            echo "BETTER_AGENT_TEST_MEMORY=5g" >> "$GITHUB_ENV"
            echo "BETTER_AGENT_TEST_XDIST=1" >> "$GITHUB_ENV"
          fi
      - name: Run backend test shard ${{ matrix.shard }}/2
        shell: bash
        run: |
          set -euo pipefail
          # Deterministic, time-balanced split (longest-processing-time bin
          # packing over scripts/ci/backend_test_timings.json) — replaces the
          # old file-COUNT `NR % N` awk split, which could (and did) put both
          # multi-minute files in the same shard while others sat idle. See
          # scripts/ci/shard_backend_tests.py's own header for the algorithm
          # and how files with no recorded timing are weighted.
          shard_files=$(python3 scripts/ci/shard_backend_tests.py --shard "${{ matrix.shard }}" --shards 2 --predict)
          echo "shard ${{ matrix.shard }}: $(echo "$shard_files" | wc -l | tr -d ' ') files"
          # --junitxml feeds phase-3 shard-rebalancing telemetry (per-test
          # durations); the working-tree run path bind-mounts this checkout
          # live at /repo, so the relative path lands directly under
          # backend/ on the host once the container exits.
          ./scripts/run-backend-tests.sh -- $shard_files -q "--junitxml=junit-shard-${{ matrix.shard }}.xml"
      # Uploaded even on failure so a shard that fails partway still
      # contributes the timings it did produce. Short retention: this is
      # rebalancing input, not a durable record, and artifact storage is
      # quota-limited.
      - name: Upload JUnit timings (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit-shard-${{ matrix.shard }}
          path: backend/junit-shard-${{ matrix.shard }}.xml
          retention-days: 3
          if-no-files-found: warn
