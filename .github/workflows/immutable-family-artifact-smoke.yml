name: Immutable family artifact smoke

on:
  pull_request:
    paths:
      - ".github/workflows/immutable-family-artifact-smoke.yml"
      - "backend/**"
      - "desktop/**"
      - "frontend/**"
      - "sdk/**"
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/immutable-family-artifact-smoke.yml"
      - "backend/**"
      - "desktop/**"
      - "frontend/**"
      - "sdk/**"
  workflow_dispatch:

jobs:
  frozen-onedir-smoke:
    name: ${{ matrix.os }} PyInstaller onedir
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install frozen build dependencies
        working-directory: backend
        run: >-
          python -m pip install
          -r requirements.txt
          -r requirements-claude.txt
          -r ../desktop/requirements.txt
          pyinstaller pytest
      - name: Verify desktop update delta
        run: python -m pytest desktop/test_update_delta.py
      - name: Build PyInstaller onedir
        working-directory: desktop
        run: python -m PyInstaller --noconfirm BetterAgent.spec
      - name: Smoke macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          artifact_root="$RUNNER_TEMP/better-agent-artifact-smoke"
          mkdir -p "$artifact_root/state"
          BETTER_AGENT_HOME="$artifact_root/state" \
            "desktop/dist/Better Agent.app/Contents/MacOS/Better Agent" \
            --frozen-artifact-smoke \
            --output "$artifact_root/result.json"
          python -c 'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")); assert set(value["families"]) == {"claude", "agy"}; assert value["windows_wrapper"] == "not-applicable"' "$artifact_root/result.json"
      - name: Smoke Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ArtifactRoot = Join-Path $env:RUNNER_TEMP "better-agent-artifact-smoke"
          New-Item -ItemType Directory -Force -Path (Join-Path $ArtifactRoot "state") | Out-Null
          $env:BETTER_AGENT_HOME = Join-Path $ArtifactRoot "state"
          $Result = Join-Path $ArtifactRoot "result.json"
          $FailureLog = Join-Path $ArtifactRoot "state\faulthandler.log"
          function Show-SmokeDiagnostics {
              if (Test-Path $Result) {
                  Get-Content $Result
              }
              if (Test-Path $FailureLog) {
                  Get-Content $FailureLog
              }
          }
          $Smoke = Start-Process `
            -FilePath "desktop\dist\Better Agent\Better Agent.exe" `
            -ArgumentList "--frozen-artifact-smoke", "--output", $Result `
            -PassThru
          $Deadline = [DateTime]::UtcNow.AddMinutes(5)
          $SeenProgress = @{}
          do {
              $Exited = $Smoke.WaitForExit(1000)
              $ProgressFiles = @(
                  Get-ChildItem `
                    -LiteralPath $ArtifactRoot `
                    -Filter "result.progress.*.json" |
                    Sort-Object -Property Name
              )
              foreach ($ProgressFile in $ProgressFiles) {
                  if ($SeenProgress.ContainsKey($ProgressFile.Name)) {
                      continue
                  }
                  try {
                      $ProgressLine = Get-Content `
                        -LiteralPath $ProgressFile.FullName `
                        -Raw
                      $null = $ProgressLine | ConvertFrom-Json
                  } catch {
                      continue
                  }
                  Write-Host "artifact-smoke-progress $ProgressLine"
                  $SeenProgress[$ProgressFile.Name] = $true
              }
              if (-not $Exited -and [DateTime]::UtcNow -ge $Deadline) {
                  Write-Host "artifact smoke exceeded its five-minute safety bound"
                  & taskkill.exe /PID $($Smoke.Id) /T /F
                  if (-not $Smoke.WaitForExit(5000)) {
                      Write-Host "artifact smoke process tree did not terminate"
                  }
                  Show-SmokeDiagnostics
                  throw "frozen artifact smoke did not exit"
              }
          } while (-not $Exited)
          if ($Smoke.ExitCode -ne 0) {
              Show-SmokeDiagnostics
              throw "frozen artifact smoke failed"
          }
          python -c "import json,sys; value=json.load(open(sys.argv[1], encoding='utf-8')); assert set(value['families']) == {'claude', 'agy'}; assert value['windows_wrapper'] == 'rejected'" $Result
      - name: Upload artifact smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immutable-family-artifact-${{ matrix.os }}
          path: ${{ runner.temp }}/better-agent-artifact-smoke/
